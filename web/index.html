<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palace of Fine Arts — walkthrough</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0d10; overflow: hidden; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  #hud { position: fixed; left: 12px; bottom: 10px; font: 12px/1.5 ui-monospace, Menlo, monospace;
         color: #e8e2d8; text-shadow: 0 1px 2px #000; pointer-events: none; }
  #hud.hidden { display: none; }
  #loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 12px;
             background: #0b0d10; color: #cfc8bb; font: 13px/1.6 ui-monospace, Menlo, monospace; }
  #track { width: 320px; height: 3px; background: #23262b; }
  #bar { width: 0; height: 100%; background: #c8a06a; transition: width .15s linear; }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud"></div>
<div id="loading"><div>Palace of Fine Arts</div><div id="track"><div id="bar"></div></div><div id="loading-text">loading…</div></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
